[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agroq-decision-intelligence-core"
version = "0.1.0"
description = "Shared graph, optimization, quantum-readiness, and reporting components for AgroQ and RNAQ."
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]
