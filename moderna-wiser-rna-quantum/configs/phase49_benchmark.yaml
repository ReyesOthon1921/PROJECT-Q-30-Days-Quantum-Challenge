dataset_path: data/benchmarks/phase49_rna_sequences.csv
strict_config_path: configs/strict_classical_foundation.yaml
benchmark_output_root: results/phase49_benchmark
calibration_output_root: results/phase49_calibration
resume: true
fail_fast: false
energy_tolerance: 1.0e-9

# Compact 3 x 3 grid. These values are screened only on the calibration split.
parameter_grid:
  overlap_penalty: [6.0, 10.0, 14.0]
  crossing_penalty: [4.0, 8.0, 12.0]

# Keep the grid screen fast and solver-consistent by selecting with greedy only.
# The best three configurations are then confirmed with the normal Phase 48
# exact/greedy/simulated-annealing settings.
screen_strict_overrides:
  solver_exact_max_variables: 0
  run_greedy: true
  run_simulated_annealing: false

confirmation_top_k: 3
