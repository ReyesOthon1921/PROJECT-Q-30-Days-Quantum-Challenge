name: AgroQ Q26-Q30 validation
on:
  pull_request:
    paths: ["agroq-lab/**", ".github/workflows/agroq-research-publication-validation.yml"]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r agroq-lab/requirements.txt
      - run: python -m pytest -q
        working-directory: agroq-lab
      - run: python research_translation_preflight.py --repo-root ..
        working-directory: agroq-lab
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - run: npm ci
        working-directory: agroq-lab/investor-ui
      - run: npm run build -- --base=/app/
        working-directory: agroq-lab/investor-ui
