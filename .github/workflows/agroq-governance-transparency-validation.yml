name: AgroQ Q23-Q25 Governance Transparency Validation

on:
  push:
    branches: [phase3-6-investor-prototype, main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-governance-transparency:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      AGROQ_DEPLOYMENT_MODE: staging
      AGROQ_BIND_HOST: 0.0.0.0
      AGROQ_DEBUG: "false"
      AGROQ_SECRET_KEY: governance-ci-secret-not-production
      AGROQ_ADMIN_USERNAME: governanceadmin
      AGROQ_ADMIN_PASSWORD: governance-ci-password-not-production
      AGROQ_DB_PATH: ${{ runner.temp }}/agroq-governance/agroq.db
      AGROQ_BACKUP_DIR: ${{ runner.temp }}/agroq-governance/backups
      WEB_CONCURRENCY: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: agroq-lab/requirements-render.txt
      - run: python -m pip install -r agroq-lab/requirements-render.txt
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: agroq-lab/investor-ui/package-lock.json
      - working-directory: agroq-lab/investor-ui
        run: npm ci
      - working-directory: agroq-lab
        run: python -m pytest -q
      - working-directory: agroq-lab
        run: python -m pytest -q tests/test_governance_transparency_preflight.py
      - working-directory: agroq-lab/investor-ui
        run: npm run build -- --base=/app/
      - run: python agroq-lab/release_preflight.py --repo-root . --allow-dirty --isolated --output-dir agroq-lab/results/release/q16
      - run: python agroq-lab/controlled_beta_preflight.py --repo-root . --output agroq-lab/results/controlled_beta/code_readiness.json
      - run: python agroq-lab/pilot_operations_preflight.py --repo-root . --output agroq-lab/results/pilot_operations/code_readiness.json
      - run: python agroq-lab/governance_transparency_preflight.py --repo-root . --output agroq-lab/results/governance_transparency/code_readiness.json
      - run: git diff --check
