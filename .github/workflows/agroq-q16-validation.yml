name: AgroQ Q16 Validation

on:
  push:
    branches:
      - phase3-6-investor-prototype
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      AGROQ_DEPLOYMENT_MODE: staging
      AGROQ_BIND_HOST: 0.0.0.0
      AGROQ_DEBUG: "false"
      AGROQ_SECRET_KEY: q16-ci-secret-not-used-in-production
      AGROQ_ADMIN_USERNAME: q16admin
      AGROQ_ADMIN_PASSWORD: q16-ci-password-not-used-in-production
      AGROQ_DB_PATH: ${{ runner.temp }}/agroq-q16/agroq.db
      AGROQ_BACKUP_DIR: ${{ runner.temp }}/agroq-q16/backups
      WEB_CONCURRENCY: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            agroq-lab/requirements.txt
            agroq-lab/requirements-render.txt

      - name: Install Python dependencies
        run: python -m pip install -r agroq-lab/requirements-render.txt

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: agroq-lab/investor-ui/package-lock.json

      - name: Install frontend dependencies
        working-directory: agroq-lab/investor-ui
        run: npm ci

      - name: Run complete AgroQ test suite
        working-directory: agroq-lab
        run: python -m pytest -q

      - name: Build investor frontend
        working-directory: agroq-lab/investor-ui
        run: npm run build -- --base=/app/

      - name: Run Q16 release preflight
        run: >-
          python agroq-lab/release_preflight.py
          --repo-root .
          --allow-dirty
          --isolated
          --output-dir agroq-lab/results/release/q16

      - name: Generate release manifest
        run: >-
          python agroq-lab/release_manifest.py
          --repo-root .
          --output agroq-lab/results/release/q16/release_manifest.json

      - name: Validate Git diff
        run: git diff --check

      - name: Upload Q16 evidence
        uses: actions/upload-artifact@v7
        with:
          name: agroq-q16-release-evidence
          path: agroq-lab/results/release/q16/
          if-no-files-found: error
          retention-days: 30
