<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#163226">
  <title>{% block title %}AgroQ Acre MVP{% endblock %}</title>
  <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="topbar">
  <div>
    <div class="brand">AgroQ Acre MVP</div>
    <div class="subtitle">Manual-first living laboratory</div>
  </div>
  <div id="connection-status" class="status-pill">Checking connection</div>
</header>
<nav class="nav">
  <a href="{{ url_for('dashboard') }}">Dashboard</a>
  <a href="{{ url_for('new_observation') }}">Record Observation</a>
  <a href="{{ url_for('manual_work') }}">Manual Work</a>
  <a href="{{ url_for('registry') }}">Registry</a>
  <a href="{{ url_for('recommendations') }}">Approvals</a>
</nav>
<main class="page">
  {% block content %}{% endblock %}
</main>
<footer>
  AgroQ prototype scaffold — human approval required for high-impact actions.
</footer>
<script src="{{ url_for('static', filename='app.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
