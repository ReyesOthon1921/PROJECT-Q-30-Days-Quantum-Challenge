<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><rect width="1200" height="620" rx="28" fill="#061b12"/><g font-family="Arial" fill="#eafff1"><text x="600" y="55" text-anchor="middle" font-size="30" font-weight="700">DNA &amp; Protein Evidence Pipeline</text><g stroke="#54df92" stroke-width="3" fill="none"><path d="M205 155 H345 M495 155 H635 M785 155 H925"/><path d="M1035 210 V330 H600 V395"/></g><g font-size="18" font-weight="700"><rect x="45" y="105" width="160" height="100" rx="18" fill="#0a2d1e" stroke="#2d8659"/><text x="125" y="145" text-anchor="middle">1. Search</text><text x="125" y="175" text-anchor="middle" font-size="14" fill="#a9c8b5">Gene · Protein · Accession</text><rect x="345" y="105" width="150" height="100" rx="18" fill="#0a2d1e" stroke="#2d8659"/><text x="420" y="145" text-anchor="middle">2. Preview</text><text x="420" y="175" text-anchor="middle" font-size="14" fill="#a9c8b5">Title · Organism · Length</text><rect x="635" y="105" width="150" height="100" rx="18" fill="#0a2d1e" stroke="#2d8659"/><text x="710" y="145" text-anchor="middle">3. Insert</text><text x="710" y="175" text-anchor="middle" font-size="14" fill="#a9c8b5">FASTA · SHA-256 · Source</text><rect x="925" y="105" width="220" height="100" rx="18" fill="#0a2d1e" stroke="#2d8659"/><text x="1035" y="145" text-anchor="middle">4. Link Experiment</text><text x="1035" y="175" text-anchor="middle" font-size="14" fill="#a9c8b5">Reference · Candidate · Control</text><rect x="430" y="395" width="340" height="105" rx="20" fill="#123d2b" stroke="#54df92"/><text x="600" y="438" text-anchor="middle">5. Human Interpretation</text><text x="600" y="468" text-anchor="middle" font-size="14" fill="#a9c8b5">Association is not causality</text></g><path d="M600 500 V545" stroke="#54df92" stroke-width="3"/><text x="600" y="582" text-anchor="middle" font-size="18" font-weight="700">6. One-click FASTA · JSON · CSV export</text></g></svg>
